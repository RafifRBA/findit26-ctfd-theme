<style id="theme-color">
:root {

  /* figma drop shadow */
  --theme-shadow: 0 4px 16px 0 rgba(0, 0, 0, 0.25);

  /* glass blur amount */
  --theme-backdrop-blur: 10px;
}

.navbar,
.jumbotron{
  background-color: var(--theme-color-rgba) !important;
  box-shadow: var(--theme-shadow) !important;

  -webkit-backdrop-filter: blur(var(--theme-backdrop-blur));
  backdrop-filter: blur(var(--theme-backdrop-blur));
}

/* optional: biar edge lebih rapi */
.navbar,
.jumbotron{
  border: 1px solid rgba(255,255,255,0.12);
